# TOTLI API — reverse proxy for a single VPS.
#
# The frontends are served by Vercel, so this host only fronts the API.
# Copy to /etc/nginx/sites-available/totli-api and symlink into sites-enabled,
# then run certbot to add the TLS block automatically.

upstream totli_api {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Telegram sends bursts of webhook updates; keep the API limit generous
# enough for real traffic but low enough to blunt scripted abuse.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;   # <-- o'z domeningizni yozing

    # certbot bu blokni HTTPS ga almashtiradi va shu redirectni qo'shadi
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;   # <-- o'z domeningizni yozing

    # certbot bu yo'llarni o'zi to'ldiradi
    # ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 2m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    gzip on;
    gzip_types application/json application/javascript text/plain text/css;

    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://totli_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # Health checks without the rate limit, for uptime monitors.
    location /api/v1/health {
        proxy_pass http://totli_api;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        return 404;
    }
}
