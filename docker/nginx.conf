# Production reverse proxy example for TOTLI
# TLS termination typically at load balancer or certbot + this config

upstream totli_api {
    server server:4000;
    keepalive 32;
}

upstream totli_web {
    server web:80;
}

upstream totli_admin {
    server admin:80;
}

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

server {
    listen 80;
    server_name _;

    # Redirect to HTTPS in production (uncomment)
    # return 301 https://$host$request_uri;

    client_max_body_size 2m;

    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://totli_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://totli_admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://totli_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SPA fallback handled by web container nginx
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
